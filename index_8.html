<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云岁月 男装商家运营工具 · 9月套装Top 200</title>
<style>
:root{
  --orange:#E87722;
  --orange-deep:#D46A15;
  --orange-soft:#FDEBDD;
  --bg:#FFF9F2;
  --card:#FFFFFF;
  --ink:#2B2B2B;
  --sub:#8A8A8A;
  --line:#F1E4D5;
  --gold:#F5B942;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
}
/* 顶部横幅 */
header{
  background:linear-gradient(135deg,#FFF4E6 0%,#FFE9CF 55%,#FFDDB8 100%);
  border-bottom:4px solid var(--orange);
  padding:34px 20px 26px;
  position:relative;
  overflow:hidden;
}
header::after{
  content:"";
  position:absolute;right:-60px;top:-60px;width:220px;height:220px;
  background:radial-gradient(circle,rgba(232,119,34,.18),transparent 70%);
  border-radius:50%;
}
header::before{
  content:"";
  position:absolute;left:-40px;bottom:-80px;width:180px;height:180px;
  background:radial-gradient(circle,rgba(245,185,66,.22),transparent 70%);
  border-radius:50%;
}
.head-inner{max-width:1280px;margin:0 auto;position:relative;z-index:2;}
.head-tag{
  display:inline-block;background:var(--orange);color:#fff;
  font-size:13px;font-weight:600;letter-spacing:1px;
  padding:6px 14px;border-radius:30px;margin-bottom:12px;
}
h1{font-size:32px;font-weight:800;color:var(--ink);letter-spacing:.5px;}
h1 .hl{color:var(--orange);}
.head-sub{margin-top:8px;color:var(--sub);font-size:15px;}
/* 统计卡 */
.stats{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap;}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:12px 20px;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(232,119,34,.06);}
.stat b{font-size:24px;color:var(--orange);font-weight:800;}
.stat span{font-size:13px;color:var(--sub);}
/* 主体 */
main{max-width:1280px;margin:26px auto 40px;padding:0 20px;}
/* 区域Tabs */
.tabs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.tab{
  background:#fff;border:2px solid var(--line);color:var(--sub);
  padding:11px 26px;border-radius:40px;font-size:15px;font-weight:600;
  cursor:pointer;transition:all .2s ease;display:flex;align-items:center;gap:8px;
}
.tab:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-2px);}
.tab.active{background:var(--orange);border-color:var(--orange);color:#fff;
  box-shadow:0 6px 18px rgba(232,119,34,.28);}
.tab .count{background:rgba(255,255,255,.25);border-radius:20px;
  padding:1px 9px;font-size:12px;font-weight:700;}
.tab:not(.active) .count{background:var(--orange-soft);color:var(--orange);}
/* 工具栏 */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-bottom:16px;flex-wrap:wrap;}
.search{flex:1;min-width:220px;max-width:420px;position:relative;}
.search input{
  width:100%;padding:11px 16px 11px 42px;border:2px solid var(--line);
  border-radius:30px;font-size:14px;background:#fff;outline:none;
  transition:border .2s;
}
.search input:focus{border-color:var(--orange);}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  color:var(--sub);font-size:15px;}
.range-info{font-size:14px;color:var(--sub);}
.range-info b{color:var(--orange);}
/* 网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
.card{
  background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  cursor:pointer;transition:transform .22s,box-shadow .22s;position:relative;
  animation:rise .5s ease both;
}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 26px rgba(43,43,43,.12);}
.card .imgwrap{aspect-ratio:3/4;overflow:hidden;background:#FBF3E9;}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
.card:hover img{transform:scale(1.06);}
.card .badge{
  position:absolute;top:10px;left:10px;background:var(--orange);color:#fff;
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;
  box-shadow:0 3px 8px rgba(232,119,34,.3);
}
.card .meta{padding:11px 13px;display:flex;align-items:center;justify-content:space-between;}
.card .rank{font-size:14px;font-weight:700;color:var(--ink);}
.card .no{font-size:12px;color:var(--sub);}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
/* 空态 */
.empty{text-align:center;padding:60px 0;color:var(--sub);font-size:15px;}
/* 灯箱 */
.lightbox{
  position:fixed;inset:0;background:rgba(20,12,6,.9);
  display:none;align-items:center;justify-content:center;z-index:100;
  padding:30px;backdrop-filter:blur(4px);
}
.lightbox.show{display:flex;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.lb-box{max-width:90vw;max-height:88vh;position:relative;text-align:center;}
.lb-box img{max-width:90vw;max-height:82vh;border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lb-cap{margin-top:14px;color:#fff;font-size:15px;opacity:.9;}
.lb-close{
  position:absolute;top:-46px;right:0;background:rgba(255,255,255,.16);
  border:none;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%;
  cursor:pointer;transition:background .2s;line-height:1;
}
.lb-close:hover{background:var(--orange);}
.lb-prev,.lb-next{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.16);border:none;color:#fff;
  font-size:26px;width:48px;height:48px;border-radius:50%;cursor:pointer;
  transition:background .2s;
}
.lb-prev{left:-64px;}.lb-next{right:-64px;}
.lb-prev:hover,.lb-next:hover{background:var(--orange);}
/* 返回顶部 */
.totop{position:fixed;right:24px;bottom:24px;width:48px;height:48px;
  border-radius:50%;background:var(--orange);color:#fff;border:none;font-size:20px;
  cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50;
  box-shadow:0 8px 20px rgba(232,119,34,.4);}
.totop.show{opacity:1;pointer-events:auto;}
/* footer */
footer{text-align:center;padding:30px 20px 40px;color:var(--sub);font-size:13px;
  border-top:1px solid var(--line);margin-top:30px;}
footer .brand{color:var(--orange);font-weight:700;font-size:15px;margin-bottom:6px;}

@media(max-width:640px){
  h1{font-size:24px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .lb-prev{left:6px;}.lb-next{right:6px;}
  .tab{padding:9px 18px;font-size:14px;}
}
</style>
</head>

};

let currentRegion = "glo";
let filter = "";
let lightboxIndex = 0;
let currentItems = [];

function el(id){return document.getElementById(id);}

function renderTabs(){
  const wrap = el("tabs");
  wrap.innerHTML = "";
  const order = [
    {key:"glo",label:"GLO区"},
    {key:"eu",label:"欧区"},
    {key:"us",label:"US区"}
  ];
  order.forEach(r=>{
    const b = document.createElement("div");
    b.className = "tab" + (r.key===currentRegion?" active":"");
    b.innerHTML = r.label + ' <span class="count">' + TOP_DATA[r.key].length + "</span>";
    b.onclick = ()=>{currentRegion = r.key; renderTabs(); renderGrid();};
    wrap.appendChild(b);
  });
}

function getFiltered(){
  const all = TOP_DATA[currentRegion];
  if(!filter) return all;
  const f = filter.toLowerCase();
  return all.filter(it=> (String(it.rank).includes(f)) || (String(it.rank).padStart(3,"0")).includes(f));
}

function renderGrid(){
  const grid = el("grid");
  currentItems = getFiltered();
  grid.innerHTML = "";
  el("shown").textContent = currentItems.length;
  el("empty").style.display = currentItems.length ? "none" : "block";
  currentItems.forEach((it,idx)=>{
    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (Math.min(idx,30)*0.03)+"s";
    card.innerHTML =
      '<div class="imgwrap"><img loading="lazy" src="' + it.url + '" alt="Top '+it.rank+'"></div>' +
      '<div class="badge">TOP '+it.rank+'</div>' +
      '<div class="meta"><span class="rank">#'+it.rank+'</span><span class="no">No.'+String(it.rank).padStart(3,"0")+'</span></div>';
    card.onclick = ()=>openLightbox(idx);
    grid.appendChild(card);
  });
}

function openLightbox(idx){
  lightboxIndex = idx;
  updateLightbox();
  el("lightbox").classList.add("show");
  document.body.style.overflow = "hidden";
}
function updateLightbox(){
  const it = currentItems[lightboxIndex];
  if(!it) return;
  el("lbImg").src = it.url;
  el("lbCap").textContent = "【"+regionName(currentRegion)+"】 Top "+it.rank+"  ·  "+(lightboxIndex+1)+" / "+currentItems.length;
}
function regionName(k){
  if(k==="glo")return "GLO区";
  if(k==="eu")return "欧区";
  return "US区";
}
function closeLightbox(){el("lightbox").classList.remove("show");document.body.style.overflow="";}
function prevImg(){lightboxIndex=(lightboxIndex-1+currentItems.length)%currentItems.length;updateLightbox();}
function nextImg(){lightboxIndex=(lightboxIndex+1)%currentItems.length;updateLightbox();}

el("search").addEventListener("input",e=>{filter=e.target.value.trim();renderGrid();});
el("lbClose").onclick=closeLightbox;
el("lbPrev").onclick=prevImg;
el("lbNext").onclick=nextImg;
el("lightbox").onclick=e=>{if(e.target===el("lightbox"))closeLightbox();};
document.addEventListener("keydown",e=>{
  if(!el("lightbox").classList.contains("show"))return;
  if(e.key==="Escape")closeLightbox();
  if(e.key==="ArrowLeft")prevImg();
  if(e.key==="ArrowRight")nextImg();
});

const totop = el("totop");
window.addEventListener("scroll",()=>{totop.classList.toggle("show",window.scrollY>300);});
totop.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

el("stTotal").textContent = TOP_DATA.glo.length + TOP_DATA.eu.length + TOP_DATA.us.length;
renderTabs();
renderGrid();
</script>
